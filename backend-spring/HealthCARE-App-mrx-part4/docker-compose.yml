services:
  mysql:
    image: mysql:8.0
    container_name: healthcare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: medical_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456789"]
      interval: 10s
      timeout: 5s
      retries: 10

  healthcare-app:
    build: .
    container_name: healthcare-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medical_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
      JWT_SECRET: healthcareplussecretkeyhealthcareplussecretkey
      JWT_EXPIRATION: 86400000
    networks:
      - healthcare-network

volumes:
  mysql_data:

networks:
  healthcare-network: